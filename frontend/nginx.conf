# Nginx serve o build do React e atua como API Gateway:
# /api/<servico>/... é encaminhado para o microsserviço correspondente.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/enrollment/ {
        proxy_pass http://enrollment-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/attendance/ {
        proxy_pass http://attendance-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
